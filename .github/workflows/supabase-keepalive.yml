name: Supabase keep-alive

# Supabase FREE-tier projects auto-pause after ~7 days with no database
# activity. A low-traffic waitlist can easily go idle, and a paused project
# makes the signup form fail (host stops resolving). This job runs a trivial
# authenticated SELECT every 2 days so the idle timer never elapses.
#
# It queries the DB with the anon key (public — same key shipped in the browser
# bundle), so the request actually reaches Postgres and counts as activity.
# A non-200 response fails the job, which also gives you free uptime monitoring.
#
# Note: GitHub disables scheduled workflows after 60 days of repo inactivity,
# and scheduled runs can be delayed under load — hence every 2 days, not 6,
# to keep comfortable margin under the 7-day pause window.

on:
  schedule:
    - cron: "0 9 */2 * *" # ~every 2 days at 09:00 UTC
  workflow_dispatch: {} # manual "Run workflow" button

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST (keeps the project awake)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/waitlist?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Supabase REST responded: HTTP ${code}"
          if [ "${code}" != "200" ]; then
            echo "::error::Keep-alive ping failed (HTTP ${code}). Project may be paused/unhealthy."
            exit 1
          fi
          echo "Project is awake."
